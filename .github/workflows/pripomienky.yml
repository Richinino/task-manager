# Plánovač pripomienok.
#
# Web Push sa musí odoslať zo servera — naplánovať notifikáciu priamo
# v telefóne by vedelo Notification Triggers API, ale to Google zastavil.
# Vercel Hobby má vlastný cron obmedzený na jeden beh denne, čo je na
# pripomienky nepoužiteľné; GitHub Actions dovolí každých 15 minút zadarmo.
#
# Odtiaľ pochádza presnosť ±15 minút. GitHub navyše negarantuje presný
# okamih — pri zaťažení beh odloží. Appka s tým ráta: berie len pripomienky,
# ktoré už dozreli, takže môžu meškať, ale nikdy neprídu skôr.
#
# ČO TREBA NASTAVIŤ (Settings → Secrets and variables → Actions):
#   PRIPOMIENKY_URL   celá adresa, napr. https://tvoja-adresa.vercel.app/api/pripomienky
#   CRON_SECRET       to isté tajomstvo, aké je v premenných na Verceli
#
# Kým nie sú nastavené, beh ZLYHÁ — nech je na prvý pohľad vidno, že sa
# pripomienky neodosielajú.

name: Pripomienky

on:
  schedule:
    # Zámerne NIE `*/15` — to padne na :00, :15, :30, :45, teda presne na
    # minúty, na ktoré si cron nastavia všetci ostatní. GitHub v tej špičke
    # behy odkladá aj celé hodiny. Nepárne minúty mimo štvrtí sú menej
    # obsadené. Časy sú v UTC; appka si deň aj hodinu prepočíta do pásma
    # používateľa sama.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Dva behy naraz by tú istú pripomienku poslali dvakrát. Bráni tomu síce
# aj jedinečný index v databáze, ale je lacnejšie ich nepustiť sem.
concurrency:
  group: pripomienky
  cancel-in-progress: false

jobs:
  odoslat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Odoslať dozreté pripomienky
        env:
          URL: ${{ secrets.PRIPOMIENKY_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Chýbajúce tajomstvo NIE JE dôvod na zelený beh.
          #
          # Pôvodne sa tu `exit 0` — a bolo to zle. Beh bez tajomstiev appku
          # vôbec nekontaktoval, ale v zozname svietil ako úspech. Takto
          # prešlo 68 behov za štyri dni a vyzeralo to, že pripomienky
          # fungujú, hoci sa ani raz nespustili.
          #
          # Plánovač, ktorý nemá kam zavolať, je pokazený — nech to aj tak
          # vyzerá. Červený krížik zmizne v momente, keď tajomstvá pribudnú.
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::error::Chýba PRIPOMIENKY_URL alebo CRON_SECRET medzi tajomstvami repozitára (Settings → Secrets and variables → Actions). Pripomienky sa neodosielajú."
            exit 1
          fi

          # `-sS` mlčí, ale chybu ukáže; telo aj kód potrebujeme oboje.
          telo=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Length: 0" \
            -w "\n%{http_code}" \
            --max-time 60)

          kod=$(printf '%s' "$telo" | tail -n1)
          vypis=$(printf '%s' "$telo" | sed '$d')

          echo "odpoveď: $vypis"
          echo "kód: $kod"

          # 503 = kľúče VAPID zatiaľ nie sú nastavené. Nie je to chyba behu,
          # len ešte nie je čo posielať.
          # 503 = kľúče VAPID chýbajú. Beh technicky prešiel, ale nič
          # neodoslal, tak nech to aspoň nie je ticho.
          if [ "$kod" = "503" ]; then
            echo "::warning::Notifikácie ešte nie sú nastavené — na Verceli chýbajú VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY."
            exit 0
          fi

          if [ "$kod" != "200" ]; then
            echo "::error::Plánovač vrátil $kod"
            exit 1
          fi
