# Plánovač pripomienok.
#
# Web Push sa musí odoslať zo servera — naplánovať notifikáciu priamo
# v telefóne by vedelo Notification Triggers API, ale to Google zastavil.
# Vercel Hobby má vlastný cron obmedzený na jeden beh denne, čo je na
# pripomienky nepoužiteľné; GitHub Actions dovolí každých 15 minút zadarmo.
#
# Odtiaľ pochádza presnosť ±15 minút. GitHub navyše negarantuje presný
# okamih — pri zaťažení beh odloží. Appka s tým ráta: berie len pripomienky,
# ktoré už dozreli, takže môžu meškať, ale nikdy neprídu skôr.
#
# ČO TREBA NASTAVIŤ (Settings → Secrets and variables → Actions):
#   PRIPOMIENKY_URL   celá adresa, napr. https://tvoja-adresa.vercel.app/api/pripomienky
#   CRON_SECRET       to isté tajomstvo, aké je v premenných na Verceli
#
# Kým nie sú nastavené, beh sa preskočí a nič nespadne.

name: Pripomienky

on:
  schedule:
    # Každých 15 minút. Časy sú v UTC; appka si deň aj hodinu prepočíta
    # do pásma používateľa sama.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Dva behy naraz by tú istú pripomienku poslali dvakrát. Bráni tomu síce
# aj jedinečný index v databáze, ale je lacnejšie ich nepustiť sem.
concurrency:
  group: pripomienky
  cancel-in-progress: false

jobs:
  odoslat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Odoslať dozreté pripomienky
        env:
          URL: ${{ secrets.PRIPOMIENKY_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "PRIPOMIENKY_URL alebo CRON_SECRET nie je nastavené — preskakujem."
            exit 0
          fi

          # `-sS` mlčí, ale chybu ukáže; telo aj kód potrebujeme oboje.
          telo=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $SECRET" \
            -H "Content-Length: 0" \
            -w "\n%{http_code}" \
            --max-time 60)

          kod=$(printf '%s' "$telo" | tail -n1)
          vypis=$(printf '%s' "$telo" | sed '$d')

          echo "odpoveď: $vypis"
          echo "kód: $kod"

          # 503 = kľúče VAPID zatiaľ nie sú nastavené. Nie je to chyba behu,
          # len ešte nie je čo posielať.
          if [ "$kod" = "503" ]; then
            echo "Notifikácie ešte nie sú nastavené (chýbajú kľúče VAPID)."
            exit 0
          fi

          if [ "$kod" != "200" ]; then
            echo "::error::Plánovač vrátil $kod"
            exit 1
          fi
