# Kontrola pri každom pushnutí.
#
# Vznikla neskoro a z konkrétneho dôvodu: do repozitára sa raz dostal commit,
# ktorý sa nepreložil. Overovací príkaz bol vtedy napísaný ako
# `npx tsc --noEmit | tail -3 && …`, a `&&` číta návratový kód `tail`, nie
# `tsc` — chyba teda prešla tichom. Tu sa to stať nemôže: každý krok beží
# samostatne a job padne na prvom neúspechu.
#
# Beží to isté, čo `npm run overit` lokálne, plus produkčný build. Ten je tu
# navyše, lebo chytá veci, ktoré ostatné kroky nevidia — najmä overenie ciest
# pri zapnutom `typedRoutes`.

name: Kontrola

on:
  push:
    branches: [main]
  pull_request:
  # Nech sa dá spustiť aj ručne, keď treba niečo preveriť bez commitu.
  workflow_dispatch:

# Nový push zruší rozbehnutú kontrolu tej istej vetvy — starý výsledok
# aj tak nikoho nezaujíma.
concurrency:
  group: kontrola-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Čistý Postgres len pre tento beh.
    #
    # Build púšťa bránu migrácií (`npm run kontrola:migracie`), ktorá sa pýta
    # databázy, či v nej dobehlo všetko z repozitára. Kým tu žiadna databáza
    # nebola, brána padala na „k databáze sa nedá pripojiť" — a tak bola
    # kontrola červená na každom commite od 8. 9. Vypnúť bránu by bolo
    # lacnejšie, ale CI by potom migrácie vôbec neoverilo. Takto sa všetky
    # migrácie naozaj pustia na prázdnu databázu (chytí sa pokazené SQL aj
    # zlé poradie) a brána potom overí, že sedia so žurnálom.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Databáza zo služby vyššie. Samotný `next build` na ňu nesiaha (všetky
      # obrazovky sú dynamické), potrebujú ju migrácie a brána.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      AUTH_SECRET: ci-placeholder-nie-je-tajomstvo
      # Prázdny zoznam znamená v produkcii „nikto" (fail-closed). Tu na tom
      # nezáleží, lebo sa nikto neprihlasuje, ale nech je to výslovné.
      ALLOWED_EMAILS: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Rovnaká hlavná verzia, na akej sa vyvíja.
          node-version: 24
          cache: npm

      - name: Inštalácia
        run: npm ci

      - name: Preklad
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Dopyty neprezrádzajú cez používateľov
        run: npm run kontrola:dopyty

      # Zámerne bez `continue-on-error`: skript sám vracia nulu, lebo je to
      # prehľad, nie brána. Výstup má byť vidieť v zázname behu.
      - name: Dizajnový systém
        run: npm run kontrola:dizajn

      # Ten istý skript, ktorý migruje produkciu pri nasadení na Verceli —
      # `MIGROVAT_PRI_BUILDE` ho pustí aj mimo Vercelu. Build nižšie potom
      # vlastnú migráciu preskočí a brána overí výsledok.
      - name: Migrácie na čistej databáze
        run: npm run db:migrate:nasadenie
        env:
          MIGROVAT_PRI_BUILDE: "1"

      - name: Produkčný build
        run: npm run build
